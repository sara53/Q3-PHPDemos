<div class="card">
  <div class="card-body">
    <p>Name :{{ myProduct?.name }}</p>
    @if (previousValue) {
    <p>Previous Product Name :{{ previousValue }}</p>
    }

    <h5>Price :{{ myProduct?.price }}</h5>
    <p>Quantity : {{ myProduct?.quantity }}</p>
    <button class="btn btn-dark" (click)="removeProduct(myProduct?.id)">
      Remove Product
    </button>
  </div>
</div>
